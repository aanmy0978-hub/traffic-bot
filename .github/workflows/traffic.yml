name: Daily Automatic Traffic

on:
  schedule:
    # يشتغل تلقائياً في الدقيقة 0 من كل ساعة (24 مرة في اليوم)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and run
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python bot.py
